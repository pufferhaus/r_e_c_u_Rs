# r_e_c_u_r key bindings.
#
# Four layers:
#   [bindings]          base layer (desktop keyboard + USB numpad normal layer)
#   [fn_bindings]       numpad FN layer, active for one key after a `000` burst
#   [detour_bindings]   auto-context: active while detour scrub is engaged
#   [shdrbnk_bindings]  auto-context: active while the shader-bank screen is up
#
# USB numpad layout — the pad is mounted rotated 90° CCW. Slots follow physical
# reading order (top-left = slot 1 … bottom = slot 0), so the slot a key fires
# is NOT the digit printed on it:
#
#   physical key:   9 6 3 / 8 5 2 / 7 4 1 / 0
#   fires slot:     1 2 3 / 4 5 6 / 7 8 9 / 0

[bindings]
# ── Desktop keyboard ──────────────────────────────────────────────────────
"Digit0" = "SelectSlot(0)"
"Digit1" = "SelectSlot(1)"
"Digit2" = "SelectSlot(2)"
"Digit3" = "SelectSlot(3)"
"Digit4" = "SelectSlot(4)"
"Digit5" = "SelectSlot(5)"
"Digit6" = "SelectSlot(6)"
"Digit7" = "SelectSlot(7)"
"Digit8" = "SelectSlot(8)"
"Digit9" = "SelectSlot(9)"
"BracketLeft" = "SetLoopIn"
"BracketRight" = "SetLoopOut"
"Backslash" = "ClearLoop"
"Space" = "TogglePlayPause"
"Tab" = "ToggleNowNext"
"KeyB" = "EnterMode(Browser)"
"KeyS" = "EnterMode(Sampler)"
"KeyG" = "EnterMode(Settings)"
"Comma" = "PrevBank"
"Period" = "NextBank"
"ArrowUp" = "NavUp"
"ArrowDown" = "NavDown"
"ArrowLeft" = "DetourScrubBy(-1)"
"ArrowRight" = "DetourScrubBy(1)"
"Enter" = "Enter"
"Escape" = "Back"
"Backspace" = "Back"
"ShiftLeft" = "ToggleFunction"
"KeyH" = "EnterMode(Shaders)"
"KeyK" = "EnterMode(ShdrBnk)"
"F1" = "TriggerShaderSlot(0)"
"F2" = "TriggerShaderSlot(1)"
"F3" = "TriggerShaderSlot(2)"
"F4" = "TriggerShaderSlot(3)"
"F5" = "TriggerShaderSlot(4)"
"F6" = "TriggerShaderSlot(5)"
"F7" = "TriggerShaderSlot(6)"
"F8" = "TriggerShaderSlot(7)"
"F9" = "TriggerShaderSlot(8)"
"F10" = "TriggerShaderSlot(9)"
"KeyD" = "DetourEnter"
"KeyE" = "DetourExit"
"KeyW" = "DetourCycleSpeed"
"KeyJ" = "DetourToggleDirection"
"KeyR" = "RecordToggle"
"KeyN" = "DetourSetStartMarker"
"KeyP" = "DetourSetEndMarker"
"KeyX" = "DetourClearMarkers"
"KeyM" = "DetourCycleMix"
"KeyC" = "AddCaptureSlot"

# ── USB numpad — normal layer (digits = trigger video slot) ───────────────
"Numpad9" = "SelectSlot(1)"
"Numpad6" = "SelectSlot(2)"
"Numpad3" = "SelectSlot(3)"
"Numpad8" = "SelectSlot(4)"
"Numpad5" = "SelectSlot(5)"
"Numpad2" = "SelectSlot(6)"
"Numpad7" = "SelectSlot(7)"
"Numpad4" = "SelectSlot(8)"
"Numpad1" = "SelectSlot(9)"
"Numpad0" = "SelectSlot(0)"
"NumpadMultiply" = "NavUp"      # ×
"NumpadDivide" = "NavDown"      # /
"NumpadSubtract" = "PrevBank"   # −
"NumpadAdd" = "NextBank"        # +
"NumpadDecimal" = "TogglePlayPause" # .
"NumpadEnter" = "Enter"
"NumLock" = "ToggleNowNext"

# ── USB numpad — FN layer (hold 000, then one key) ────────────────────────
[fn_bindings]
"Numpad9" = "EnterMode(Sampler)"   # slot 1
"Numpad6" = "EnterMode(Browser)"   # slot 2
"Numpad3" = "EnterMode(Settings)"  # slot 3
"Numpad8" = "EnterMode(Shaders)"   # slot 4
"Numpad5" = "EnterMode(ShdrBnk)"   # slot 5
"Numpad2" = "DetourEnter"          # slot 6
"Numpad7" = "SetLoopIn"            # slot 7
"Numpad4" = "ClearLoop"            # slot 8
"Numpad1" = "SetLoopOut"           # slot 9
"Numpad0" = "AddCaptureSlot"       # slot 0
"NumpadMultiply" = "PrevMode"      # ×  — step up the mode list
"NumpadDivide" = "NextMode"        # /  — step down the mode list
"NumpadSubtract" = "ToggleFeedback" # −
"NumpadAdd" = "RecordToggle"       # +
"NumpadEnter" = "DetourExit"
"Backspace" = "Panic"

# ── Auto-context — DETOUR scrub (digits become scrub controls) ────────────
[detour_bindings]
"Numpad8" = "DetourScrubBy(-1)"       # slot 4
"Numpad2" = "DetourScrubBy(1)"        # slot 6
"Numpad4" = "DetourCycleSpeed"        # slot 8
"Numpad6" = "DetourToggleDirection"   # slot 2
"Numpad7" = "DetourSetStartMarker"    # slot 7
"Numpad1" = "DetourSetEndMarker"      # slot 9
"Numpad5" = "DetourClearMarkers"      # slot 5
"Numpad9" = "DetourCycleMix"          # slot 1
"Numpad3" = "DetourTogglePlay"        # slot 3
"NumpadDecimal" = "DetourTogglePlay"  # .
"NumpadEnter" = "DetourExit"

# ── Auto-context — SHADER BANK (digits trigger shader slots) ──────────────
[shdrbnk_bindings]
"Numpad9" = "TriggerShaderSlot(1)"
"Numpad6" = "TriggerShaderSlot(2)"
"Numpad3" = "TriggerShaderSlot(3)"
"Numpad8" = "TriggerShaderSlot(4)"
"Numpad5" = "TriggerShaderSlot(5)"
"Numpad2" = "TriggerShaderSlot(6)"
"Numpad7" = "TriggerShaderSlot(7)"
"Numpad4" = "TriggerShaderSlot(8)"
"Numpad1" = "TriggerShaderSlot(9)"
"Numpad0" = "TriggerShaderSlot(0)"
