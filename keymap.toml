# Default keyboard bindings.

[bindings]
"Digit0" = "SelectSlot(0)"
"Digit1" = "SelectSlot(1)"
"Digit2" = "SelectSlot(2)"
"Digit3" = "SelectSlot(3)"
"Digit4" = "SelectSlot(4)"
"Digit5" = "SelectSlot(5)"
"Digit6" = "SelectSlot(6)"
"Digit7" = "SelectSlot(7)"
"Digit8" = "SelectSlot(8)"
"Digit9" = "SelectSlot(9)"
"BracketLeft" = "SetLoopIn"
"BracketRight" = "SetLoopOut"
"Backslash" = "ClearLoop"
"Space" = "TogglePlayPause"
"Tab" = "ToggleNowNext"
"KeyB" = "EnterMode(Browser)"
"KeyS" = "EnterMode(Sampler)"
"KeyG" = "EnterMode(Settings)"
"Comma" = "PrevBank"
"Period" = "NextBank"
"ArrowUp" = "NavUp"
"ArrowDown" = "NavDown"
"ArrowLeft" = "DetourScrubBy(-1)"
"ArrowRight" = "DetourScrubBy(1)"
"Enter" = "Enter"
"Escape" = "Back"
"Backspace" = "Back"
"ShiftLeft" = "ToggleFunction"
"KeyH" = "EnterMode(Shaders)"
"KeyK" = "EnterMode(ShdrBnk)"
"F1" = "TriggerShaderSlot(0)"
"F2" = "TriggerShaderSlot(1)"
"F3" = "TriggerShaderSlot(2)"
"F4" = "TriggerShaderSlot(3)"
"F5" = "TriggerShaderSlot(4)"
"F6" = "TriggerShaderSlot(5)"
"F7" = "TriggerShaderSlot(6)"
"F8" = "TriggerShaderSlot(7)"
"F9" = "TriggerShaderSlot(8)"
"F10" = "TriggerShaderSlot(9)"
"KeyD" = "DetourEnter"
"KeyE" = "DetourExit"
"KeyW" = "DetourCycleSpeed"
"KeyJ" = "DetourToggleDirection"
"KeyR" = "RecordToggle"
"KeyN" = "DetourSetStartMarker"
"KeyP" = "DetourSetEndMarker"
"KeyX" = "DetourClearMarkers"
"KeyM" = "DetourCycleMix"
"KeyC" = "AddCaptureSlot"

# USB numpad bindings (normal layer)
"Numpad0" = "SelectSlot(0)"
"Numpad1" = "SelectSlot(1)"
"Numpad2" = "SelectSlot(2)"
"Numpad3" = "SelectSlot(3)"
"Numpad4" = "SelectSlot(4)"
"Numpad5" = "SelectSlot(5)"
"Numpad6" = "SelectSlot(6)"
"Numpad7" = "SelectSlot(7)"
"Numpad8" = "SelectSlot(8)"
"Numpad9" = "SelectSlot(9)"
"NumpadSubtract" = "PrevBank"
"NumpadAdd" = "NextBank"
"NumpadMultiply" = "NavUp"
"NumpadDivide" = "NavDown"
"NumpadDecimal" = "TogglePlayPause"
"NumpadEnter" = "Enter"

[fn_bindings]
# USB numpad FN layer — active after triple-tap KP0 (000 burst)
"NumpadSubtract" = "EnterMode(Browser)"
"NumpadAdd" = "EnterMode(Settings)"
"NumpadMultiply" = "EnterMode(Sampler)"
"NumpadDivide" = "EnterMode(Shaders)"
"NumpadDecimal" = "DetourEnter"
"NumpadEnter" = "DetourExit"
"Backspace" = "Panic"
"Numpad0" = "ToggleNowNext"
"Numpad1" = "SetLoopIn"
"Numpad2" = "RecordToggle"
"Numpad3" = "AddCaptureSlot"
"Numpad4" = "SeekBack"
"Numpad5" = "ToggleFeedback"
"Numpad6" = "SeekForward"
"Numpad7" = "SetLoopIn"
"Numpad8" = "ClearLoop"
"Numpad9" = "SetLoopOut"
